org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
# AGP 9.3.1 未对 SysUISdk 发出 unsupported preview SDK 警告；无需 suppression。
# AOSP 依赖资源传递合并进 app 的 R (com.android.systemui.R 含所有依赖资源)，
# 故用 transitive R 以对齐 AOSP 源码里的 R.xxx 引用方式
android.nonTransitiveRClass=false
android.useNonFinalResourceIds=false
kotlin.code.style=official
android.builtInKotlin=true
# 允许 KSP 插件通过 kotlin.sourceSets 添加生成源码；builtInKotlin 下需允许此操作
android.disallowKotlinSourceSets=false
ksp.incremental=false
