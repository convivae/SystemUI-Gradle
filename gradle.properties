org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.suppressUnsupportedCompileSdk=JdJkcSdk
# AOSP 依赖资源传递合并进 app 的 R (com.android.systemui.R 含所有依赖资源)，
# 故用 transitive R 以对齐 AOSP 源码里的 R.xxx 引用方式
android.nonTransitiveRClass=false
android.useNonFinalResourceIds=false
kotlin.code.style=official
# Enable kapt with built-in Kotlin
android.builtInKotlin=false
android.newDsl=false
