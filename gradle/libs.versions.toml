[versions]
media3 = "1.11.0"
agp = "9.3.1"
# Kotlin 2.2.10 对齐 AGP 9.3.1 嵌入编译器 + KSP 2.2.10-2.0.2
# Kotlin 由 AGP builtInKotlin=true 提供（版本随 AGP 9.3.1 = Kotlin 2.2.10）
# kotlin-compose 插件版本须与 AGP 内置 Kotlin 版本一致
kotlin = "2.2.10"
compose = "1.11.4"
composeMaterialIcons = "1.7.8"
androidxCore = "1.19.0"
androidxAnnotation = "1.11.0-alpha01"
jsr305 = "3.0.2"
material = "1.14.0"
material3 = "1.5.0-alpha18"
kotlinxCoroutines = "1.11.0"
dagger = "2.59.2"
guava = "33.4.8-android"
lottie = "6.6.6"
constraintlayout = "2.2.2"
androidxLifecycle = "2.11.0"
androidxFragment = "1.9.0-rc01"
androidxPreference = "1.2.1"
androidxLeanback = "1.3.0-alpha02"
androidxLeanbackPreference = "1.2.0"
androidxSlice = "1.1.0-alpha02"
androidxMedia = "1.9.0-alpha01"
# androidx.media:media library (distinct from androidxMedia = mediarouter); pinned 1.8.0
media = "1.8.0"
androidxConcurrent = "1.4.0-alpha01"
androidxExifinterface = "1.4.2"
androidxCardview = "1.0.0"
androidxRecyclerView = "1.4.0"
androidxAsyncLayoutInflater = "1.1.0"
androidxViewPager2 = "1.1.0"
androidxDynamicanimation = "1.1.0"
androidxConstraintlayoutCore = "1.1.0"
androidxPalette = "1.1.0-alpha01"
androidxActivity = "1.13.0"
androidxDatastore = "1.3.0-alpha10"
androidxWindow = "1.6.0-alpha05"
androidxTracing = "2.0.0-rc01"
androidxSavedstate = "1.5.0"
androidxRoom = "2.8.4"
androidxAppcompat = "1.8.0-rc01"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Compose Compiler plugin — 必须与 Kotlin 编译器版本对齐 (Kotlin 2.x)
# 没有它，Compose 的 inline metadata 不会被生成，导致 "Couldn't inline method call" 内部错误
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media = { group = "androidx.media", name = "media", version.ref = "media" }
# AndroidX Core
androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-core-animation = { module = "androidx.core:core-animation", version = "1.0.0" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "jsr305" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "androidxCardview" }
androidx-concurrent-futures = { module = "androidx.concurrent:concurrent-futures", version.ref = "androidxConcurrent" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-constraintlayout-core = { module = "androidx.constraintlayout:constraintlayout-core", version.ref = "androidxConstraintlayoutCore" }
androidx-dynamicanimation = { module = "androidx.dynamicanimation:dynamicanimation", version.ref = "androidxDynamicanimation" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "androidxExifinterface" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "androidxFragment" }
androidx-leanback = { module = "androidx.leanback:leanback", version.ref = "androidxLeanback" }
androidx-leanback-preference = { module = "androidx.leanback:leanback-preference", version.ref = "androidxLeanbackPreference" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidxLifecycle" }
androidx-mediarouter = { module = "androidx.mediarouter:mediarouter", version.ref = "androidxMedia" }
androidx-palette = { module = "androidx.palette:palette", version.ref = "androidxPalette" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "androidxPreference" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidxRecyclerView" }
androidx-asynclayoutinflater = { module = "androidx.asynclayoutinflater:asynclayoutinflater", version.ref = "androidxAsyncLayoutInflater" }
androidx-slice-builders = { module = "androidx.slice:slice-builders", version.ref = "androidxSlice" }
androidx-slice-core = { module = "androidx.slice:slice-core", version.ref = "androidxSlice" }
androidx-slice-view = { module = "androidx.slice:slice-view", version.ref = "androidxSlice" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "androidxViewPager2" }

# Material
# material = { module = "com.google.android.material:material", version.ref = "material" }

# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

# Dagger
dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }

# Compose（公网 1.11.4 是最高保留 ExperimentalAnimatableApi 的版本）
compose-animation = { module = "androidx.compose.animation:animation", version.ref = "compose" }
compose-animation-graphics = { module = "androidx.compose.animation:animation-graphics", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "composeMaterialIcons" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "composeMaterialIcons" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-material3-window-size = { module = "androidx.compose.material3:material3-window-size-class", version.ref = "material3" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }

# AndroidX（使用官方公网 Maven 坐标；AOSP 内部 prebuilt 版本不照搬）
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-datastore-core = { module = "androidx.datastore:datastore-core", version.ref = "androidxDatastore" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDatastore" }
androidx-window = { module = "androidx.window:window", version.ref = "androidxWindow" }
androidx-tracing = { module = "androidx.tracing:tracing", version.ref = "androidxTracing" }
androidx-savedstate-ktx = { module = "androidx.savedstate:savedstate-ktx", version.ref = "androidxSavedstate" }
androidx-concurrent-futures-ktx = { module = "androidx.concurrent:concurrent-futures-ktx", version.ref = "androidxConcurrent" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidxRoom" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "androidxRoom" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidxRoom" }

# Third-party
google-material = { module = "com.google.android.material:material", version.ref = "material" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
errorprone-annotations = { module = "com.google.errorprone:error_prone_annotations", version = "2.50.0" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
lottie-compose = { module = "com.airbnb.android:lottie-compose", version.ref = "lottie" }

androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "androidxLifecycle" }

# Local Maven jars for AOSP internal Flags classes
android-server-notification-flags = { group = "com.android.server", name = "notification-flags", version = "1.0.0" }
# Local Maven AARs (libs/maven/)：由 tools/package_aosp_aar.py 生成到 libs/aars/，
# 再由 tools/install_aar_to_maven.py 安装到 libs/maven/ 并生成 POM 骨架
systemui-settingslib = { group = "com.android.systemui", name = "SettingsLib", version = "1.0.0" }
systemui-wifitrackerlib = { group = "com.android.systemui", name = "WifiTrackerLib", version = "1.0.0" }
systemui-wmshell = { group = "com.android.systemui", name = "WindowManager-Shell", version = "1.0.0" }
systemui-wmshell-shared = { group = "com.android.systemui", name = "WindowManager-Shell-shared", version = "1.0.0" }
systemui-animationlib = { group = "com.android.systemui", name = "animationlib", version = "1.0.0" }
systemui-iconloader = { group = "com.android.systemui", name = "iconloader", version = "1.0.0" }
systemui-lowlight-dream-lib = { group = "com.android.systemui", name = "LowLightDreamLib", version = "1.0.0" }
systemui-settingslib-color = { group = "com.android.settingslib", name = "color", version = "1.0.0" }
systemui-settingslib-theme = { group = "com.android.systemui", name = "SettingsLibSettingsTheme", version = "1.0.0" }
# Task 015（B2 可达性最小集，ADR 0005）：SettingsLib per-target res-only AAR，
# 经 SettingsLib POM 传递依赖获得，未被 build 文件直接引用（仅作注册表登记）
systemui-settingslib-selector-with-widget-preference = { group = "com.android.systemui", name = "SettingsLibSelectorWithWidgetPreference", version = "1.0.0" }
systemui-settingslib-restricted-lock-utils = { group = "com.android.systemui", name = "SettingsLibRestrictedLockUtils", version = "1.0.0" }
systemui-settingslib-action-buttons-preference = { group = "com.android.systemui", name = "SettingsLibActionButtonsPreference", version = "1.0.0" }
systemui-settingslib-progress-bar = { group = "com.android.systemui", name = "SettingsLibProgressBar", version = "1.0.0" }
systemui-settingslib-two-target-preference = { group = "com.android.systemui", name = "SettingsLibTwoTargetPreference", version = "1.0.0" }
systemui-settingslib-layout-preference = { group = "com.android.systemui", name = "SettingsLibLayoutPreference", version = "1.0.0" }
systemui-settingslib-adaptive-icon = { group = "com.android.systemui", name = "SettingsLibAdaptiveIcon", version = "1.0.0" }
systemui-setupcompat = { group = "com.android.systemui", name = "setupcompat", version = "1.0.0" }

